# Usar H2 en memoria y forzar la compatibilidad con MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=DATABASE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=admin

# Permitir que Hibernate genere las tablas automáticamente y evitar leer los scripts manuales en el test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desactivar la inicialización por script en los tests para saltarse el DROP DATABASE problemático
spring.sql.init.mode=never

# Habilitar la consola web de H2 en el entorno de pruebas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Asegurar que use un puerto fijo (8080)
server.port=8080
